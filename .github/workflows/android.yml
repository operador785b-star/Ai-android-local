name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Etiqueta del borrador de GitHub Releases
        type: string
      apk_run_id:
        description: ID de la compilación aprobada que contiene ambos APK
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || (inputs.release_tag == '' && inputs.apk_run_id == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK y NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/ia-local-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/android-commandline-tools.zip"
          curl --fail --location --silent --show-error --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$archive"
          printf '%s  %s\n' 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258 "$archive" | sha256sum --check
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$archive" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          sdkmanager="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Preparar llama.cpp
        run: scripts/fetch-llama.sh
      - name: Probar y compilar
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleVisualPreview :app:assembleDebugAndroidTest
      - name: Verificar y preparar APK instalable
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IA-Local-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/IA-Local-Android.apk
          (cd dist && sha256sum IA-Local-Android.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: IA-Local-Android-ARM64
          path: dist/
          if-no-files-found: error
      - name: Preparar APK de vista previa
        run: |
          mkdir -p preview-dist
          cp app/build/outputs/apk/visualPreview/app-visualPreview.apk preview-dist/IA-Local-Android-vista-previa.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose preview-dist/IA-Local-Android-vista-previa.apk
          (cd preview-dist && sha256sum IA-Local-Android-vista-previa.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: IA-Local-Android-vista-previa-ARM64
          path: preview-dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Capturas-Liquid-Glass
          path: app/build/previews/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes-android
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.apk_run_id != '')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publicar los APK de la compilación aprobada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GH_REPO/actions/runs/$APK_RUN_ID")
          revision=$(jq -er --arg repo "$GH_REPO" '
            select(.conclusion == "success" and .head_repository.full_name == $repo
              and .path == ".github/workflows/android.yml") | .head_sha' <<< "$run")
          release=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish)
          jq -e --arg revision "$revision" '.isDraft and .targetCommitish == $revision' <<< "$release" >/dev/null

          staging=$(mktemp -d)
          gh run download "$APK_RUN_ID" --name IA-Local-Android-ARM64 --dir "$staging/standard"
          gh run download "$APK_RUN_ID" --name IA-Local-Android-vista-previa-ARM64 --dir "$staging/preview"
          (cd "$staging/standard" && sha256sum --check SHA256SUMS)
          (cd "$staging/preview" && sha256sum --check SHA256SUMS)
          gh release upload "$RELEASE_TAG" \
            "$staging/standard/IA-Local-Android.apk" \
            "$staging/preview/IA-Local-Android-vista-previa.apk"
          gh release edit "$RELEASE_TAG" --draft=false
