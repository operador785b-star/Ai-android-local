name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK y NDK
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Preparar llama.cpp
        run: scripts/fetch-llama.sh
      - name: Probar y compilar
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verificar y preparar APK instalable
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IA-Local-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/IA-Local-Android.apk
          (cd dist && sha256sum IA-Local-Android.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: IA-Local-Android-ARM64
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes-android
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
